# The database lives on Neon, not Render. Render's free Postgres is deleted 30 days after
# creation, which took the API down once already.
services:
  - type: web
    name: ramhub-backend-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # sync: false means Render keeps this value in the dashboard and never reads it from
      # this file. The Neon connection string contains a password and must not be committed.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # Covers the Vercel production domain and every per-deploy preview subdomain.
      - key: CORS_ORIGIN_REGEX
        value: 'https://.*\.vercel\.app'
