databases:
  - name: ramhub-db
    plan: free
    databaseName: ramhub
    user: ramhub

services:
  - type: web
    name: ramhub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ramhub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'
