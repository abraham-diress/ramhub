databases:
  - name: ramhub-db
    plan: free
    databaseName: ramhub
    user: ramhub

services:
  - type: web
    name: ramhub-backend-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ramhub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'
      # Covers the Vercel production domain and every per-deploy preview subdomain.
      - key: CORS_ORIGIN_REGEX
        value: 'https://.*\.vercel\.app'
